name: Deploy Backend and Seed Database

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'sensobox_back/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Find EC2 Instance
        id: find-instance
        run: |
          # Buscar instancia por IP o cualquier instancia running
          INSTANCE_ID=$(aws ec2 describe-instances --region eu-north-1 \
            --filters "Name=instance-state-name,Values=running" \
            --query "Reservations[*].Instances[*].InstanceId" \
            --output text | head -1)
          
          if [ -z "$INSTANCE_ID" ] || [[ "$INSTANCE_ID" != i-* ]]; then
            echo "⚠️ No se encontró instancia, intentando por IP..."
            INSTANCE_ID=$(aws ec2 describe-instances --region eu-north-1 \
              --query "Reservations[*].Instances[?PublicIpAddress=='13.61.115.247'].InstanceId" \
              --output text | head -1)
          fi
          
          if [ -n "$INSTANCE_ID" ] && [[ "$INSTANCE_ID" == i-* ]]; then
            echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
            echo "✅ Instancia encontrada: $INSTANCE_ID"
          else
            echo "❌ No se encontró instancia EC2"
            exit 1
          fi

      - name: Deploy Backend
        if: steps.find-instance.outputs.instance_id != ''
        run: |
          INSTANCE_ID="${{ steps.find-instance.outputs.instance_id }}"
          
          echo "🚀 Desplegando backend en instancia: $INSTANCE_ID"
          
          COMMAND_ID=$(aws ssm send-command \
            --region eu-north-1 \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /opt/sensobox-backend && git fetch origin main && git reset --hard origin/main && npm install && npm run build && sudo systemctl restart sensobox-backend && sleep 5 && sudo systemctl status sensobox-backend --no-pager -l"]' \
            --timeout-seconds 600 \
            --output text \
            --query 'Command.CommandId')
          
          echo "Command ID: $COMMAND_ID"
          echo "⏳ Esperando a que el despliegue termine..."
          
          # Esperar hasta 5 minutos
          for i in {1..30}; do
            sleep 10
            STATUS=$(aws ssm get-command-invocation \
              --region eu-north-1 \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "InProgress")
            
            if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ]; then
              echo "📊 Estado final: $STATUS"
              aws ssm get-command-invocation \
                --region eu-north-1 \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query '[StandardOutputContent,StandardErrorContent]' \
                --output text
              break
            fi
            echo "⏳ Esperando... ($i/30)"
          done

      - name: Seed Database
        if: steps.find-instance.outputs.instance_id != ''
        run: |
          INSTANCE_ID="${{ steps.find-instance.outputs.instance_id }}"
          
          echo "🌱 Ejecutando seeder en la base de datos..."
          
          COMMAND_ID=$(aws ssm send-command \
            --region eu-north-1 \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /opt/sensobox-backend && sudo systemctl start mongod 2>/dev/null || true && if [ ! -f generate-company-data.ts ]; then git clone https://github.com/codeintimes/sensobox.git /tmp/sensobox-temp 2>/dev/null; cp /tmp/sensobox-temp/sensobox_back/generate-company-data.ts . 2>/dev/null; rm -rf /tmp/sensobox-temp; fi && export MONGODB_URL=\"mongodb://localhost:27017/sensobox\" && export NODE_OPTIONS=\"--max-old-space-size=4096\" && echo \"🌱 Iniciando seeder...\" && npx ts-node generate-company-data.ts && echo \"✅ Seeder completado!\" && node -e \"const mongoose=require(\\\"mongoose\\\");const {UserModel}=require(\\\"./dist/src/auth/domain/schemas/user.schema\\\");const {OrderModel}=require(\\\"./dist/src/order/domain/schemas/order.schema\\\");mongoose.connect(\\\"mongodb://localhost:27017/sensobox\\\").then(async()=>{const u=await UserModel.countDocuments();const o=await OrderModel.countDocuments();const cu=await UserModel.countDocuments({companyName:\\\"TEST COMPANY\\\"});const co=await OrderModel.countDocuments({companyName:\\\"TEST COMPANY\\\"});console.log(\\\"📊 Resumen:\\\");console.log(\\\"   Total usuarios: \\\"+u);console.log(\\\"   Total órdenes: \\\"+o);console.log(\\\"   Usuarios TEST COMPANY: \\\"+cu);console.log(\\\"   Órdenes TEST COMPANY: \\\"+co);mongoose.disconnect();process.exit(0);}).catch(e=>{console.error(\\\"Error:\\\",e.message);process.exit(1);});\""]' \
            --timeout-seconds 900 \
            --output text \
            --query 'Command.CommandId')
          
          echo "Command ID: $COMMAND_ID"
          echo "⏳ Esperando a que el seeder termine (esto puede tardar varios minutos)..."
          
          # Esperar hasta 15 minutos
          for i in {1..90}; do
            sleep 10
            STATUS=$(aws ssm get-command-invocation \
              --region eu-north-1 \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "InProgress")
            
            if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ]; then
              echo "📊 Estado final: $STATUS"
              aws ssm get-command-invocation \
                --region eu-north-1 \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query '[StandardOutputContent,StandardErrorContent]' \
                --output text | head -100
              break
            fi
            if [ $((i % 6)) -eq 0 ]; then
              echo "⏳ Esperando... ($i/90) - Esto puede tardar varios minutos"
            fi
          done

