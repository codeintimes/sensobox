name: Deploy to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: eu-north-1
  EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
  S3_BUCKET_FRONTEND: sensobox-frontend
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  deploy-backend:
    name: Deploy Backend to EC2
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[deploy]') || github.event_name == 'workflow_dispatch' || contains(join(github.event.head_commit.modified, ','), 'sensobox_back')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sensobox_back/package-lock.json

      - name: Install dependencies
        working-directory: ./sensobox_back
        run: npm ci

      - name: Build backend
        working-directory: ./sensobox_back
        run: npm run build
        env:
          NODE_ENV: production

      - name: Create deployment package
        run: |
          cd sensobox_back
          tar -czf ../backend-deploy.tar.gz \
            dist/ \
            package.json \
            package-lock.json \
            node_modules/ \
            .env.example

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Copy files to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "$EC2_SSH_KEY" > deploy_key.pem
          chmod 600 deploy_key.pem
          
          scp -i deploy_key.pem -o StrictHostKeyChecking=no \
            backend-deploy.tar.gz \
            deploy-backend.sh \
            $EC2_USER@$EC2_HOST:/tmp/
          
          ssh -i deploy_key.pem -o StrictHostKeyChecking=no \
            $EC2_USER@$EC2_HOST 'bash /tmp/deploy-backend.sh'

      - name: Cleanup
        if: always()
        run: rm -f deploy_key.pem backend-deploy.tar.gz

  deploy-frontend:
    name: Deploy Frontend to S3
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[deploy]') || github.event_name == 'workflow_dispatch' || contains(join(github.event.head_commit.modified, ','), 'sensobox_front')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sensobox_front/package-lock.json

      - name: Install dependencies
        working-directory: ./sensobox_front
        run: npm ci

      - name: Build frontend
        working-directory: ./sensobox_front
        run: npm run build
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL || 'http://13.61.115.247:4000' }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync sensobox_front/build/ s3://${{ env.S3_BUCKET_FRONTEND }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "service-worker.js" \
            --exclude "manifest.json"

      - name: Deploy HTML files with no cache
        run: |
          aws s3 sync sensobox_front/build/ s3://${{ env.S3_BUCKET_FRONTEND }}/ \
            --delete \
            --cache-control "public, max-age=0, must-revalidate" \
            --exclude "*" \
            --include "*.html" \
            --include "service-worker.js" \
            --include "manifest.json"

      - name: Invalidate CloudFront cache
        if: env.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

